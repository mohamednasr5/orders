<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">نظام إدارة الطلبات | SaaS OMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="logo-icon" style="font-size: 50px; color: var(--primary);"><i class='bx bx-cube-alt'></i></div>
            <h2>SaaS OMS</h2>
            <p data-i18n="loginDesc">الرجاء تسجيل الدخول للوصول إلى النظام</p>
            
            <!-- Email/Password Login Form -->
            <form id="email-login-form" style="margin-top: 20px;">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--text-secondary);">البريد الإلكتروني</label>
                    <input type="email" id="login-email" class="form-control" placeholder="example@email.com" required 
                           style="width:100%;padding:12px 15px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--text-secondary);">كلمة المرور</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required 
                           style="width:100%;padding:12px 15px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);">
                </div>
                <button type="submit" id="btn-email-login" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
                    <i class='bx bx-log-in'></i> <span>تسجيل الدخول</span>
                </button>
                <p style="text-align:center;margin-top:12px;">
                    <a href="javascript:void(0)" id="forgot-password-link" style="color:var(--text-secondary);text-decoration:none;font-size:13px;">نسيت كلمة المرور؟</a>
                </p>
            </form>

            <div style="text-align:center;margin:15px 0;position:relative;">
                <span style="background:var(--bg-body);padding:0 10px;color:var(--text-secondary);font-size:13px;">أو</span>
                <div style="position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border-color);z-index:-1;"></div>
            </div>

            <button id="btn-google-login" type="button" class="btn-outline" style="width: 100%; justify-content: center;">
                <i class='bx bxl-google'></i> <span>تسجيل الدخول بـ Google</span>
            </button>
            
            <p style="text-align:center;margin-top:15px;font-size:12px;color:var(--text-secondary);">
                ليس لديك حساب؟ <a href="javascript:void(0)" onclick="openRegisterModal()" id="show-register" style="color:var(--primary);text-decoration:none;font-weight:600;">إنشاء حساب جديد</a>
            </p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;padding:20px;">
        <div class="modal" style="max-width:450px;width:100%;background:var(--bg-card);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden;">
            <div class="modal-header" style="padding:20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;">
                <h3 style="margin:0;font-size:18px;color:var(--text-primary);"><i class='bx bx-user-plus'></i> إنشاء حساب جديد</h3>
                <button onclick="document.getElementById('register-modal').style.display='none'" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-secondary);padding:0;line-height:1;">×</button>
            </div>
            <div class="modal-body" style="padding:20px;">
                <form id="register-form">
                    <div style="margin-bottom: 15px;">
                        <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary);font-weight:500;">الاسم الكامل *</label>
                        <input type="text" id="reg-name" placeholder="أحمد محمد" required
                               style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);box-sizing:border-box;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary);font-weight:500;">البريد الإلكتروني *</label>
                        <input type="email" id="reg-email" placeholder="example@email.com" required
                               style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);box-sizing:border-box;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary);font-weight:500;">كلمة المرور * (6 أحرف على الأقل)</label>
                        <input type="password" id="reg-password" required minlength="6"
                               style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);box-sizing:border-box;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-secondary);font-weight:500;">تأكيد كلمة المرور *</label>
                        <input type="password" id="reg-confirm" required
                               style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-main);color:var(--text-primary);box-sizing:border-box;">
                    </div>
                    <button type="submit" id="btn-register-submit" 
                            style="width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
                        <i class='bx bx-user-plus'></i> إنشاء الحساب
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Initial Loader -->
    <div id="app-loader" class="app-loader hidden">
        <div class="spinner"></div>
        <h2 data-i18n="loading">جاري تهيئة النظام...</h2>
    </div>

    <div id="app-container" class="hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class='bx bx-cube-alt'></i></div>
                <h2 class="logo-text">SaaS OMS</h2>
                <i class='bx bx-menu toggle-btn' id="toggle-sidebar"></i>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#" data-route="dashboard"><i class='bx bx-grid-alt'></i><span class="link-name" data-i18n="dashboard">لوحة القيادة</span></a></li>
                <li><a href="#" data-route="orders"><i class='bx bx-cart'></i><span class="link-name" data-i18n="orders">الطلبات</span></a></li>
                <li><a href="#" data-route="products"><i class='bx bx-box'></i><span class="link-name" data-i18n="products">المنتجات</span></a></li>
                <li><a href="#" data-route="inventory"><i class='bx bx-store'></i><span class="link-name" data-i18n="inventory">المخزون</span></a></li>
                <li><a href="#" data-route="crm"><i class='bx bx-user-pin'></i><span class="link-name" data-i18n="crm">العملاء (CRM)</span></a></li>
                <li><a href="#" data-route="reports"><i class='bx bx-pie-chart-alt-2'></i><span class="link-name" data-i18n="reports">التقارير</span></a></li>
                <li><a href="#" data-route="settings"><i class='bx bx-cog'></i><span class="link-name" data-i18n="settings">الإعدادات</span></a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="top-nav">
                <div class="search-box">
                    <i class='bx bx-search'></i>
                    <input type="text" placeholder="البحث برقم الطلب، العميل..." data-i18n-ph="searchPlaceholder">
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" id="theme-toggle" title="تغيير المظهر"><i class='bx bx-moon'></i></button>
                    <button class="icon-btn" id="lang-toggle" title="تغيير اللغة">EN</button>
                    <div class="notification-bell">
                        <i class='bx bx-bell'></i>
                        <span class="badge">0</span>
                    </div>
                    <div class="profile-dropdown">
                        <img src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff" alt="Profile" class="profile-img" id="user-avatar">
                        <span class="profile-name" id="user-name">المستخدم</span>
                        <i class='bx bx-log-out' id="btn-logout" title="تسجيل الخروج" style="cursor:pointer; margin-right:5px; color: var(--danger);"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <section class="view-container" id="view-container">
                <!-- Content injected here via JS -->
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase SDKs (Modular) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
