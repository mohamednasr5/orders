<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        canvas { margin: 10px; border: 1px solid #ddd; }
        .download-btn { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Click buttons to download icons</p>
    <div id="container"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#2563eb');
            gradient.addColorStop(1, '#7c3aed');
            
            // Rounded rectangle background
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Package icon
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.45}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📦', size/2, size/2 + size*0.02);
            
            return canvas;
        }
        
        sizes.forEach(size => {
            const canvas = createIcon(size);
            const container = document.getElementById('container');
            
            const div = document.createElement('div');
            div.style.display = 'inline-block';
            div.style.margin = '10px';
            
            div.appendChild(canvas);
            
            const btn = document.createElement('button');
            btn.className = 'download-btn';
            btn.textContent = `${size}x${size}`;
            btn.onclick = () => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            div.appendChild(document.createElement('br'));
            div.appendChild(btn);
            
            container.appendChild(div);
        });
    </script>
</body>
</html>
